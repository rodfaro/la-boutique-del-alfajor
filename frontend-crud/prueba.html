<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administración</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Alertify CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <!-- Alertify Default theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <!-- CSS Propios -->
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="./css/adminPruba.css">
    <!-- JS-Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--JS-Alertify -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
    <!--Javascript Propio -->
    <script src="./index.js"></script>
  </head>
  <body>
    

    <div class="contenedor">
        <!--BOTON (AGREGAR)-->
        <button id="btnCrear" type="button" class="btn btn-primary boton-agregar" data-bs-toggle="modal" data-bs-target="#modalProducto">Agregar</button>
        <!--TABLA-->
        <table id="tablaProductos" class="table tabla-productos">
            <thead>
                <tr class="text-center">
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Imagen</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>


    <!--MODAL-->
    <div id="modalProducto" class="modal fade modal-producto" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
        <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Nuevo Producto</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <!--Formulario-->
            <form>
                <!--Campos del formulario-->
                <div class="mb-3">
                    <label for="nombre" class="col-form-label">Nombre</label>
                    <input type="text" class="form-control input-producto" id="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="precio" class="col-form-label">Precio</label>
                    <input type="number" class="form-control input-producto" id="precio" required>
                </div>
                <div class="mb-3">
                    <label for="archivo" class="col-form-label">Imagen</label>
                    <input type="file" class="form-control input-producto" id="archivo" required>
                </div>
            
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
        </div>
    </div>
    </div>

  </body>
</html>
