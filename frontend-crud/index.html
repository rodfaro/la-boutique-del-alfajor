<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

    <!-- HEADER -->

    <header class="admin-header">
       <nav class="nav-bar-admin">
            <a href="./index.html">
                <img src="/recursos/img/Laboutique-Logo.png" alt="Logo La Boutique del Alfajor">
            </a>

            <div class="titulo-admin">
                <h1>Panel de Administración</h1>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO -->

    <main class="crud-admin">

        <!-- ========================= -->
        <!-- AGREGAR PRODUCTO -->
        <!-- ========================= -->

        <section class="crud-card">

            <h2>➕ Agregar Producto</h2>

            <!-- POST: el navegador maneja el envio directamente -->
            <!-- action = a donde se envia, method = como se envia, enctype = formato multipart para archivos -->
            <form
                action="/api/v1/productos"
                method="post"
                enctype="multipart/form-data">

                <label for="id-nombre">
                    Nombre del producto
                </label>

                <input
                    type="text"
                    name="nombre"
                    id="id-nombre"
                    placeholder="Ej: Alfajor Triple Chocolate">

                <label for="id-precio">
                    Precio
                </label>

                <input
                    type="text"
                    name="precio"
                    id="id-precio"
                    placeholder="Ej: 3500">

                <label for="id-imagen">
                    Imagen
                </label>

                <input
                    type="file"
                    name="archivo"
                    id="id-imagen">

                <button type="submit">
                    Agregar producto
                </button>

            </form>

        </section>

        <!-- ========================= -->
        <!-- ACTUALIZAR PRODUCTO -->
        <!-- ========================= -->

        <section class="crud-card">

            <h2>✏️ Actualizar Producto</h2>

            <!-- PUT: el navegador no soporta method="put" en forms, por eso lo maneja JavaScript -->
            <!-- sin action ni method porque el envio lo hace fetch() -->
            <form id="form-put">

                <label for="id-put">
                    ID del producto
                </label>

                <input
                    type="text"
                    name="id"
                    id="id-put"
                    placeholder="Ingrese el ID">

                
                <button
                    type="button"
                    class="btn-secundario"
                    onclick="buscarProducto()">
                    Buscar producto
                </button> 
                
                <label for="nombre-put">
                    Nuevo nombre
                </label>

                <input
                    type="text"
                    name="nombre"
                    id="nombre-put">

                <label for="precio-put">
                    Nuevo precio
                </label>

                <input
                    type="text"
                    name="precio"
                    id="precio-put">

                <label for="imagen-put">
                    Nueva imagen
                </label>

                <input
                    type="file"
                    name="archivo"
                    id="imagen-put">

                <!-- input oculto que guarda el nombre de la imagen actual -->
                <!-- se usa si el usuario no sube una imagen nueva -->
                <input
                    type="hidden"
                    name="imgActual"
                    id="imgActual">

                <!-- type="button" evita que el form se envie solo, onclick llama a la funcion -->
                <button
                    type="button"
                    onclick="actualizar()">
                    Actualizar producto
                </button>

            </form>

        </section>

        <!-- ========================= -->
        <!-- ELIMINAR PRODUCTO -->
        <!-- ========================= -->

        <section class="crud-card">

            <h2>🗑️ Eliminar Producto</h2>

            <!-- DELETE: solo necesita el ID, sin archivos ni campos extra -->
            <div class="delete-container">

                <label for="id-delete">
                    ID del producto
                </label>

                <input
                    type="text"
                    id="id-delete"
                    placeholder="Ingrese el ID">

                <!-- fetch con method DELETE, no necesita body porque solo usa el ID en la URL -->
                <button
                    type="button"
                    onclick="eliminar()">
                    Eliminar producto
                </button>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer class="pie">
        <p>
            &copy;2026 La Boutique del Alfajor.
            Todos los derechos reservados.
        </p>
    </footer>

    <!-- SCRIPTS -->

    <script>

        // Busca el producto por ID y carga sus datos en el formulario
        async function buscarProducto() {

            const id =
                document.getElementById('id-put').value;

            // GET al servidor para traer los datos actuales del producto
            const respuesta =
                await fetch(`/api/v1/productos/${id}`);

            const producto =
                await respuesta.json();

            // carga los valores actuales en los inputs del form
            document.getElementById('nombre-put').value = producto.nombre;
            document.getElementById('precio-put').value = producto.precio;
            // guarda la imagen actual en el input oculto para no perderla
            document.getElementById('imgActual').value = producto.img;
        }

        async function actualizar() {

            const id =
                document.getElementById('id-put').value;

            // FormData permite enviar texto e imagenes juntos (igual que enctype multipart)
            const formData =
                new FormData();

            formData.append(
                'nombre',
                document.getElementById('nombre-put').value
            );

            formData.append(
                'precio',
                document.getElementById('precio-put').value
            );

            // enviamos la imagen actual por si no se sube una nueva
            formData.append(
                'imgActual',
                document.getElementById('imgActual').value
            );

            // si el usuario selecciono una imagen nueva, la agregamos al FormData
            const archivo =
                document.getElementById('imagen-put').files[0];

            if (archivo) {
                formData.append('archivo', archivo);
            }

            // fetch hace el PUT que el navegador no puede hacer solo
            const respuesta =
                await fetch(`/api/v1/productos/${id}`, {
                    method: 'PUT',
                    body: formData
                });

            const datos =
                await respuesta.json();

            alert(datos.mensaje);
        }

        async function eliminar() {

            const id =
                document.getElementById('id-delete').value;

            // fetch con method DELETE, no necesita body porque solo usa el ID en la URL
            const respuesta =
                await fetch(`/api/v1/productos/${id}`, {
                    method: 'DELETE'
                });

            const datos =
                await respuesta.json();

            alert(datos.mensaje);
        }

    </script>

</body>
</html>
