<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="./css/index.css">
    <script type="module" src="./index.js" defer></script>
</head>
<body>
    <h1>ADMIN - CRUD</h1>
    <section class="contenedor-crud">
        <div class="tablero-crud">
            <button id="btnCrear" type="button">Crear +</button>
            <div class="grilla-contenedor">
                <table id="tabla-productos" class="tabla">

                </table>
            </div>
        </div>
    </section>

    <!-- DIALOG / DAR DE ALTA ALFAJOR -->
      <!-- ===== MODAL: se abre con btnCrear, se cierra con btnCancelar o al guardar ===== -->
    <dialog id="dialogProducto">
        <form id="formProducto">
            <h2 id="TituloDialog">Nuevo alfajor</h2>
            <input type="hidden" id="productoId">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>
 
            <label for="precio">Precio</label>
            <input type="number" id="precio" name="precio" min="0" step="0.01" required>
 
            <label for="imagen">Imagen</label>
            <input type="file" id="imagen" name="imagen" accept="image/*">
 
            <div class="acciones-dialog">
                <button type="button" id="btnCancelar">Cancelar</button>
                <button type="button" id="btnCrearAlfajor">Guardar</button>
            </div>
        </form>
    </dialog>
</body>
</html>
