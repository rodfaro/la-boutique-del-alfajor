<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="./css/admin.css">
</head>
<body>

    <!-- HEADER -->

    <header class="admin-header">
       <nav class="nav-bar-admin">
            <a href="./index.html">
                <img src="/recursos/img/Laboutique-Logo.png" alt="Logo La Boutique del Alfajor">
            </a>

            <div class="titulo-admin">
                <h1>Panel de Administración</h1>
            </div>
        </nav>
    </header>

    <!-- CONTENIDO -->

    <main class="crud-admin">

        <!-- ========================= -->
        <!-- AGREGAR PRODUCTO -->
        <!-- ========================= -->

        <section class="crud-card">

            <h2>➕ Agregar Producto</h2>

            <form
                action="/api/v1/productos"
                method="post"
                enctype="multipart/form-data">

                <label for="id-nombre">
                    Nombre del producto
                </label>

                <input
                    type="text"
                    name="nombre"
                    id="id-nombre"
                    placeholder="Ej: Alfajor Triple Chocolate">

                <label for="id-precio">
                    Precio
                </label>

                <input
                    type="text"
                    name="precio"
                    id="id-precio"
                    placeholder="Ej: 3500">

                <label for="id-imagen">
                    Imagen
                </label>

                <input
                    type="file"
                    name="archivo"
                    id="id-imagen">

                <button type="submit">
                    Agregar producto
                </button>

            </form>

        </section>

        <!-- ========================= -->
        <!-- ACTUALIZAR PRODUCTO -->
        <!-- ========================= -->

        <section class="crud-card">

            <h2>✏️ Actualizar Producto</h2>

            <form id="form-put">

                <label for="id-put">
                    ID del producto
                </label>

                <input
                    type="text"
                    name="id"
                    id="id-put"
                    placeholder="Ingrese el ID">

                <label for="nombre-put">
                    Nuevo nombre
                </label>

                <input
                    type="text"
                    name="nombre"
                    id="nombre-put">

                <label for="precio-put">
                    Nuevo precio
                </label>

                <input
                    type="text"
                    name="precio"
                    id="precio-put">

                <label for="imagen-put">
                    Nueva imagen
                </label>

                <input
                    type="file"
                    name="archivo"
                    id="imagen-put">

                <input
                    type="hidden"
                    name="imgActual"
                    id="imgActual">

                <button
                    type="button"
                    onclick="actualizar()">
                    Actualizar producto
                </button>

            </form>

        </section>

        <!-- ========================= -->
        <!-- ELIMINAR PRODUCTO -->
        <!-- ========================= -->

        <section class="crud-card">

            <h2>🗑️ Eliminar Producto</h2>

            <div class="delete-container">

                <label for="id-delete">
                    ID del producto
                </label>

                <input
                    type="text"
                    id="id-delete"
                    placeholder="Ingrese el ID">

                <button
                    type="button"
                    onclick="eliminar()">
                    Eliminar producto
                </button>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer class="pie">
        <p>
            &copy;2026 La Boutique del Alfajor.
            Todos los derechos reservados.
        </p>
    </footer>

    <!-- SCRIPTS -->

    <script>

        async function actualizar() {

            const id =
                document.getElementById('id-put').value;

            const formData =
                new FormData();

            formData.append(
                'nombre',
                document.getElementById('nombre-put').value
            );

            formData.append(
                'precio',
                document.getElementById('precio-put').value
            );

            formData.append(
                'imgActual',
                document.getElementById('imgActual').value
            );

            const archivo =
                document.getElementById('imagen-put').files[0];

            if (archivo) {
                formData.append('archivo', archivo);
            }

            const respuesta =
                await fetch(`/api/v1/productos/${id}`, {
                    method: 'PUT',
                    body: formData
                });

            const datos =
                await respuesta.json();

            alert(datos.mensaje);
        }

        async function eliminar() {

            const id =
                document.getElementById('id-delete').value;

            const respuesta =
                await fetch(`/api/v1/productos/${id}`, {
                    method: 'DELETE'
                });

            const datos =
                await respuesta.json();

            alert(datos.mensaje);
        }

    </script>

</body>
</html>
